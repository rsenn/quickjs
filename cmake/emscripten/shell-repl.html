<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>QuickJS REPL (WASM)</title>
    <style>
      body { font-family: monospace; margin: 1em; }
      #output {
        width: 100%;
        height: 32em;
        background: #111;
        color: #ddd;
        white-space: pre;
        overflow-y: scroll;
        padding: 0.5em;
        box-sizing: border-box;
      }
      #input-row { display: flex; margin-top: 0.5em; }
      #prompt { padding-right: 0.5em; }
      #input { flex: 1; font-family: monospace; }
      #input:disabled { color: #888; }
    </style>
  </head>
  <body>
    <h3>QuickJS REPL (WASM)</h3>
    <div id="output"></div>
    <div id="input-row">
      <span id="prompt">&gt;</span>
      <input id="input" type="text" autocomplete="off" autofocus disabled>
    </div>

    <script type="text/javascript">
      var outputElement = document.getElementById('output');
      var inputElement = document.getElementById('input');

      function appendOutput(text) {
        outputElement.textContent += text;
        outputElement.scrollTop = outputElement.scrollHeight;
      }

      // Each line is a single, synchronous round trip into the wasm module
      // (qjs_repl_eval() in cmake/emscripten/qjs-repl-wasm.c) rather than
      // feeding a blocking terminal read, which the qjs.c REPL can't do in
      // a browser (see the comment at the top of that file).
      function evalLine(line) {
        var resultPtr = Module.ccall('qjs_repl_eval', 'number', ['string'], [line]);
        var result = Module.UTF8ToString(resultPtr);
        Module.ccall('qjs_repl_free_result', null, ['number'], [resultPtr]);
        return result;
      }

      inputElement.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !inputElement.disabled) {
          var line = inputElement.value;
          inputElement.value = '';
          appendOutput('> ' + line + '\n');
          var result = evalLine(line);
          if (result) appendOutput(result + '\n');
        }
      });

      var Module = {
        preRun: [],
        postRun: [
          function() {
            inputElement.disabled = false;
            inputElement.focus();
            appendOutput('QuickJS WASM REPL ready. Type an expression and press Enter.\n');
          }
        ],
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          appendOutput(text + '\n');
        },
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          appendOutput(text + '\n');
        },
        setStatus: function(text) {
          if (text) appendOutput(text + '\n');
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
